<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | ВетКлиника «Симба»</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- НАВИГАЦИЯ -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse-fill"></i> Симба</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/shop.html">Магазин</a></li>
                <li class="nav-item"><a class="nav-link" href="/services.html">Услуги</a></li>
                <li class="nav-item"><a class="nav-link active" href="/reels.html">Инфостенд</a></li>
                <li class="nav-item"><a class="nav-link" href="/schedule.html">Расписание</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors.html">Сотрудники</a></li>
                <li class="nav-item"><a class="nav-link" href="/gallery.html">Галерея</a></li>
                <li class="nav-item"><a class="nav-link" href="/certificates.html">Сертификаты</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts.html">Контакты</a></li>
                <li class="nav-item ms-lg-3" id="userMenu">
                    <a class="btn btn-outline-light btn-sm rounded-pill px-3 active" href="/login.html"><i class="bi bi-person"></i> Войти</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ФОРМЫ -->
<section class="d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 64px);padding:100px 0 60px">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <i class="bi bi-heart-pulse-fill text-primary display-4"></i>
                    <h2 class="fw-bold mt-2">С возвращением!</h2>
                    <p class="text-muted">Войдите в личный кабинет</p>
                </div>

                <!-- Табы -->
                <ul class="nav nav-pills nav-fill mb-4" id="loginTabs">
                    <li class="nav-item">
                        <button class="nav-link active" data-tab="client">Клиент / Врач</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-tab="admin">Администратор</button>
                    </li>
                </ul>

                <!-- Форма клиента/врача -->
                <div id="formClient">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <div id="loginAlert" style="display:none"></div>
                            <form id="loginForm" autocomplete="on">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" id="loginEmail" placeholder="your@email.ru" required autocomplete="email">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Пароль</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••" required autocomplete="current-password">
                                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1"><i class="bi bi-eye"></i></button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mt-2" id="loginBtn">
                                    <i class="bi bi-box-arrow-in-right"></i> Войти
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <p class="text-muted small">Нет аккаунта? <a href="/register.html" class="fw-semibold text-primary">Зарегистрироваться</a></p>
                    </div>
                </div>

                <!-- Форма админа -->
                <div id="formAdmin" style="display:none">
                    <div class="card border-0 shadow-sm rounded-4 border-primary border-2">
                        <div class="card-body p-4">
                            <div class="text-center mb-3">
                                <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                                <h6 class="fw-bold mt-1">Вход для администратора</h6>
                            </div>
                            <div id="adminAlert" style="display:none"></div>
                            <form id="adminForm" autocomplete="off">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-person-badge text-muted"></i></span>
                                        <input type="email" class="form-control" id="adminLogin" placeholder="admin@clinic.ru" autocomplete="username" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Пароль</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="bi bi-lock-fill text-muted"></i></span>
                                        <input type="password" class="form-control" id="adminPassword" placeholder="••••••" autocomplete="new-password" required>
                                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1"><i class="bi bi-eye"></i></button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mt-2" id="adminBtn">
                                    <i class="bi bi-shield-check"></i> Войти как админ
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
