<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | ВетКлиника «Симба»</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

<!-- НАВИГАЦИЯ АДМИНА -->
<nav class="navbar navbar-expand-lg fixed-top bg-dark" id="adminNav">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/admin.html"><i class="bi bi-shield-lock-fill text-primary"></i> Админ-панель</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link text-white" href="/"><i class="bi bi-house"></i> На сайт</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" id="adminLogout"><i class="bi bi-box-arrow-right"></i> Выйти</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-5 pt-3">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-2 d-none d-md-block bg-dark min-vh-100 p-3" id="adminSidebar">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white active" href="#" data-section="dashboard"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="products"><i class="bi bi-box-seam"></i> Товары</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="orders"><i class="bi bi-bag-check"></i> Заказы</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="users"><i class="bi bi-people"></i> Пользователи</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="doctors"><i class="bi bi-heart-pulse"></i> Врачи (одобрение)</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="services"><i class="bi bi-clipboard2-pulse"></i> Услуги</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="categories"><i class="bi bi-tags"></i> Категории</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="posts"><i class="bi bi-newspaper"></i> Инфостенд</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="schedule"><i class="bi bi-calendar-check"></i> Расписание</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="gallery"><i class="bi bi-images"></i> Галерея</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#" data-section="certificates"><i class="bi bi-award"></i> Сертификаты</a></li>
            </ul>
        </div>

        <!-- Контент -->
        <div class="col-md-10 p-4" id="adminContent">
            <h3 class="fw-bold mb-4"><i class="bi bi-speedometer2 text-primary"></i> Дашборд</h3>
            <div class="row g-4" id="dashboardStats">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm text-center p-4">
                        <i class="bi bi-people fs-1 text-primary"></i>
                        <h4 class="fw-bold mt-2" id="statUsers">-</h4>
                        <small class="text-muted">Пользователей</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm text-center p-4">
                        <i class="bi bi-hourglass-split fs-1 text-warning"></i>
                        <h4 class="fw-bold mt-2" id="statPendingDoctors">-</h4>
                        <small class="text-muted">Врачей на проверке</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm text-center p-4">
                        <i class="bi bi-bag fs-1 text-success"></i>
                        <h4 class="fw-bold mt-2" id="statOrders">-</h4>
                        <small class="text-muted">Заказов</small>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm text-center p-4">
                        <i class="bi bi-newspaper fs-1 text-info"></i>
                        <h4 class="fw-bold mt-2" id="statPosts">-</h4>
                        <small class="text-muted">Постов</small>
                    </div>
                </div>
            </div>
            <div id="sectionContent" class="mt-4"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
