<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ оформлен | ВетКлиника «Симба»</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-heart-pulse-fill"></i> Симба</a>
        <div class="ms-auto">
            <a href="/" class="btn btn-nav-auth btn-sm rounded-pill px-3"><i class="bi bi-house"></i> На главную</a>
        </div>
    </div>
</nav>

<section class="d-flex align-items-center justify-content-center" style="min-height:100vh;padding:100px 0 60px">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <i class="bi bi-check-circle-fill text-success display-1"></i>
                <h1 class="fw-bold mt-3 mb-2">Заказ оформлен!</h1>
                <p class="text-muted mb-4">Мы свяжемся с вами для подтверждения</p>

                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">
                        <p class="text-muted small mb-1">Номер заказа</p>
                        <h3 class="fw-bold text-primary mb-0" id="orderNumber">—</h3>
                    </div>
                </div>

                <p class="text-muted small mb-4">
                    <i class="bi bi-info-circle"></i> Сохраните номер заказа. Назовите его при получении.
                </p>

                <a href="/" class="btn btn-primary rounded-pill px-4">На главную</a>
                <a href="/shop.html" class="btn btn-outline-primary rounded-pill px-4">Продолжить покупки</a>
            </div>
        </div>
    </div>
</section>

<script>
    const params = new URLSearchParams(window.location.search);
    const number = params.get('number');
    if (number) document.getElementById('orderNumber').textContent = number;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
